<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body>
    <script>
        // Listen for the file from Streamlit
        window.addEventListener("message", async (event) => {
            if (event.data.type === "PROCESS_PDF") {
                try {
                    const { base64Pdf } = event.data;
                    const pdfDoc = await PDFLib.PDFDocument.load(base64Pdf);
                    
                    // Browser-side optimization
                    // This removes duplicate objects and compresses streams
                    const compressedBytes = await pdfDoc.save({ 
                        useObjectStreams: true,
                        addDefaultFont: false 
                    });

                    // Send back to Streamlit
                    window.parent.postMessage({
                        type: "streamlit:setComponentValue",
                        value: Array.from(compressedBytes)
                    }, "*");
                } catch (e) {
                    console.error("Browser Error:", e);
                }
            }
        });
    </script>
</body>
</html>
